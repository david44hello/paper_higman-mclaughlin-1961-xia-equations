# Lean project for the paper "Xia's equations for the Higman-McLaughlin (1961) conjecture". Lean 4 v4.35.0 + Mathlib.
name = "XiaLean"
version = "0.1.0"
defaultTargets = ["Xia"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Xia"
globs = ["Xia"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
